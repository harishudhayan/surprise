<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Meenu</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Mukta+Malar:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--sky1:#1a1440;--sky2:#3b1f5c;--gold:#ffd27a;--rose:#ff8fab;--cream:#fff3e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,#6a2c6b);color:var(--cream);font-family:'Mukta Malar','Noto Sans Tamil',sans-serif;text-align:center}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity 1.2s}
.stage.on{opacity:1;pointer-events:auto}
h1{font-family:'Caveat',cursive,serif;font-weight:700;font-size:clamp(44px,12vw,84px);line-height:1.05;color:var(--gold);text-shadow:0 0 30px rgba(255,210,122,.45)}
p.sub{margin-top:14px;font-size:clamp(16px,4.2vw,20px);opacity:.85;max-width:30ch;line-height:1.7}
button{margin-top:30px;font:inherit;font-size:18px;color:#3a1747;background:var(--gold);border:0;border-radius:999px;padding:13px 30px;cursor:pointer;box-shadow:0 0 28px rgba(255,210,122,.5);transition:transform .2s}
button:hover{transform:scale(1.05)}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
/* cake */
#cake{width:min(260px,64vw);margin-top:10px;overflow:visible}
#flame{cursor:pointer;transform-origin:130px 78px;animation:flick .5s infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.92,1.1) rotate(2deg)}}
#flame.out{animation:none;opacity:0;transition:opacity .4s}
.hint{margin-top:18px;font-size:18px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.4}}
/* letter */
#line{min-height:9.5em;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,5.4vw,29px);line-height:1.75;max-width:22ch;transition:opacity .8s,transform .8s}
#line.fade{opacity:0;transform:translateY(10px)}
.dots{display:flex;gap:8px;margin-top:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--cream);opacity:.25;transition:.4s}
.dots i.a{opacity:1;background:var(--rose);transform:scale(1.3)}
@media (prefers-reduced-motion:reduce){#flame,.hint{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<section class="stage on" id="s1">
  <h1>Meenu…</h1>
  <p class="sub">உனக்காக ஒரு சின்ன surprise இருக்கு 💛</p>
  <button id="go">திறந்து பார்</button>
</section>

<section class="stage" id="s2">
  <h1 style="font-size:clamp(36px,10vw,64px)">Happy Birthday!</h1>
  <svg id="cake" viewBox="0 0 260 230" aria-label="birthday cake">
    <ellipse cx="130" cy="214" rx="120" ry="12" fill="#000" opacity=".25"/>
    <rect x="30" y="140" width="200" height="70" rx="14" fill="#ff8fab"/>
    <rect x="52" y="98" width="156" height="50" rx="12" fill="#ffc2d1"/>
    <path d="M30 156q20 22 40 0t40 0 40 0 40 0 40 0v-16H30z" fill="#fff3e2"/>
    <path d="M52 112q19 20 39 0t39 0 39 0 39 0v-14H52z" fill="#fff3e2"/>
    <circle cx="80" cy="185" r="6" fill="#ffd27a"/><circle cx="130" cy="190" r="6" fill="#ffd27a"/><circle cx="180" cy="185" r="6" fill="#ffd27a"/>
    <rect x="124" y="66" width="12" height="36" rx="3" fill="#ffd27a"/>
    <g id="flame"><ellipse cx="130" cy="52" rx="20" ry="26" fill="#ffd27a" opacity=".25"/><path d="M130 30c9 12 11 20 0 34-11-14-9-22 0-34z" fill="#ffb347"/><path d="M130 44c4 6 5 10 0 17-5-7-4-11 0-17z" fill="#fff6c9"/></g>
  </svg>
  <p class="hint" id="hint">தீபத்தை தொடு, ஒரு wish பண்ணு ✨</p>
</section>

<section class="stage" id="s3">
  <div id="line"></div>
  <div class="dots" id="dots"></div>
  <button id="next">அடுத்து</button>
</section>

<section class="stage" id="s4">
  <h1>Happy Birthday,<br>Meenu 💛</h1>
  <p class="sub">உன் எல்லா wish-உம் நிறைவேறட்டும்.</p>
  <button id="again">மறுபடி பார்க்க</button>
</section>

<script>
// ✏️ இங்க உன் வார்த்தைகளை மாத்திக்கோ
var LINES=[
 "Meenu, இன்னைக்கு உலகத்துக்கு ஒரு அழகான மனசு கிடைச்ச நாள்.",
 "நீ சிரிச்சா அந்த நாளே அழகா மாறிடும். அது உனக்கே தெரியாது.",
 "யாருக்கும் தெரியாம நீ எத்தனையோ நாள் கஷ்டப்பட்டிருப்ப. ஆனாலும் மத்தவங்களுக்காக சிரிச்சிருப்ப.",
 "அந்த பொறுமையும், அந்த அன்பும்தான் உன்ன இவ்ளோ special ஆக்குது.",
 "உன்ன மாதிரி ஒருத்தர் வாழ்க்கைல இருக்கிறதே ஒரு வரம்.",
 "இந்த வருஷம் நீ எல்லாருக்கும் கொடுத்த அன்பு, ரெட்டிப்பா உன்கிட்டயே திரும்பி வரட்டும்.",
 "நீ சந்தோஷமா இருந்தா, அது நிறைய பேரோட சந்தோஷம். அதனால எப்பவும் சிரிச்சுட்டே இரு, Meenu 💛"
];
var cv=document.getElementById('c'),cx=cv.getContext('2d'),W,H,P=[],mode='amb';
function size(){var d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
size();addEventListener('resize',size);
var R=Math.random,COL=['#ffd27a','#ff8fab','#fff3e2','#b8a1ff','#8fe3ff'];
// ambient fireflies + stars
var fl=[];for(var i=0;i<60;i++)fl.push({x:R()*W,y:R()*H,r:R()*1.8+.4,s:R()*.3+.05,p:R()*6});
function heart(x,y,s,c,a){cx.save();cx.globalAlpha=a;cx.fillStyle=c;cx.translate(x,y);cx.scale(s,s);cx.beginPath();cx.moveTo(0,3);cx.bezierCurveTo(-6,-3,-3,-8,0,-4);cx.bezierCurveTo(3,-8,6,-3,0,3);cx.fill();cx.restore()}
function burst(n,hearts){for(var i=0;i<n;i++){var a=R()*6.28,v=R()*9+3;P.push({x:W/2,y:H*.55,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,c:COL[i%5],h:hearts&&R()<.55,s:R()*1.6+.8,l:1,g:.16})}}
function rain(){P.push({x:R()*W,y:-20,vx:R()*1-.5,vy:R()*2+1.5,c:COL[(R()*2)|0?1:0],h:true,s:R()*1.6+.8,l:1,g:0})}
var raining=false;
function loop(t){cx.clearRect(0,0,W,H);
 fl.forEach(function(f){f.y-=f.s;f.x+=Math.sin(t/900+f.p)*.3;if(f.y<-5){f.y=H+5;f.x=R()*W}
  cx.globalAlpha=.35+.5*Math.abs(Math.sin(t/700+f.p));cx.fillStyle='#ffe9b0';cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.28);cx.fill()});
 if(raining&&R()<.25)rain();
 P=P.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l-=.006;
  if(p.h)heart(p.x,p.y,p.s,p.c,Math.max(p.l,0));else{cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,5*p.s,3*p.s)}
  return p.l>0&&p.y<H+30});
 cx.globalAlpha=1;requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function show(id){document.querySelectorAll('.stage').forEach(function(s){s.classList.toggle('on',s.id===id)})}
var $=function(i){return document.getElementById(i)},idx=0;
$('go').onclick=function(){show('s2')};
$('flame').onclick=function(){
 this.classList.add('out');$('hint').textContent='💛';burst(140,true);
 setTimeout(function(){burst(90,true)},500);
 setTimeout(function(){idx=0;show('s3');say()},2800)};
var dots=$('dots');LINES.forEach(function(){dots.appendChild(document.createElement('i'))});
function say(){var l=$('line');l.classList.add('fade');
 setTimeout(function(){l.textContent=LINES[idx];l.classList.remove('fade');
  [].forEach.call(dots.children,function(d,i){d.classList.toggle('a',i===idx)});
  $('next').textContent=idx===LINES.length-1?'கடைசியா 💛':'அடுத்து'},500)}
$('next').onclick=function(){
 if(idx<LINES.length-1){idx++;say()}else{show('s4');raining=true;burst(120,true)}};
$('again').onclick=function(){raining=false;$('flame').classList.remove('out');$('hint').textContent='தீபத்தை தொடு, ஒரு wish பண்ணு ✨';show('s1')};
</script>
</body>
</html>
